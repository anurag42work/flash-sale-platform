server:
  port: ${PORT:8082}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${DB_USERNAME:catalog_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    # Keep DB connections out of the view layer; transactions end in the service layer.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Consumer only (order.failed); key and value are Strings, the value is the event envelope as JSON.
    consumer:
      # All catalog-service instances share this group: each order.failed partition goes to one of them.
      group-id: catalog-service
      # A new consumer group starts at the oldest event, so nothing published before the first start is skipped.
      auto-offset-reset: earliest
      # Offsets are committed by our code (ack after the DB commit), never on a timer.
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
