server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # Downstream addresses come from env vars: localhost for run-local.sh, container names on the VM.
          # Which paths need a token is decided in SecurityConfig, not here.
          routes:
            - id: auth
              uri: ${AUTH_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: catalog
              uri: ${CATALOG_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/**
            - id: order
              uri: ${ORDER_URL:http://localhost:8083}
              predicates:
                - Path=/api/orders/**
  security:
    oauth2:
      resourceserver:
        jwt:
          # Public keys of auth-service. Fetched on the first request with a token, then cached,
          # so the gateway starts even when auth-service is down.
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          # Must equal the "iss" claim auth-service puts in tokens. With jwk-set-uri set,
          # Spring Boot only compares this value (no OpenID discovery call).
          issuer-uri: ${JWT_ISSUER:flash-sale-auth}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
