# Local infrastructure only (Postgres, Redis, Kafka). Services run on the host via scripts/run-local.sh.
# Sized for a laptop with Docker capped at 3 GB: total limits = 512m + 128m + 768m.
# Ports bind to 127.0.0.1 so nothing is reachable from the network.
#
#   cp .env.example .env   # once, then set passwords
#   docker compose -f deploy/compose.infra.yml up -d

name: flashsale-infra

services:
  postgres:
    image: postgres:16.16-alpine
    mem_limit: 512m
    # POSTGRES_PASSWORD and the per-service *_DB_PASSWORD values come from .env.
    env_file:
      - path: ../.env
        required: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on the first start (empty volume): creates one role + database per service.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine
    mem_limit: 128m
    # Cache + rate-limit counters only: no persistence. Evict least-recently-used keys at 64 MB.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru",
              "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    # Same 3.9 line as the kafka-clients (3.9.2) managed by Spring Boot 3.5.16.
    # Not 3.9.2: on 2026-11-15 its amd64 image failed with "exec format error" (broken image), 3.9.1 works.
    image: apache/kafka:3.9.1
    mem_limit: 768m
    environment:
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
      # Store data on the kafkadata volume (the image default is /tmp/kafka-logs inside the container,
      # which is lost when the container is recreated).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single node in KRaft mode: this broker is also its own controller (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # HOST listener for apps on the laptop (localhost:9092),
      # INTERNAL listener for containers on the compose network (kafka:29092), used later.
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      # The check starts its own JVM: give it a small heap so it does not inherit the
      # broker's 384m and push the container past its memory limit.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
